<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Mobile-first, offline-ready 2-player chess game with 100% correct FIDE rules.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chess">
  <title>Grandmaster Chess — Mobile PWA</title>

  <!-- Google Fonts: Plus Jakarta Sans & Cinzel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./src/assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="./src/assets/icons/icon-192.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/css/styles.css">
  <link rel="stylesheet" href="./src/css/responsive.css">
</head>
<body>
  <!-- Liquid Glass Ambient Lighting Canvas -->
  <div class="liquid-bg-container" aria-hidden="true">
    <div class="liquid-orb orb-indigo"></div>
    <div class="liquid-orb orb-cyan"></div>
    <div class="liquid-orb orb-violet"></div>
    <div class="liquid-orb orb-amber"></div>
    <div class="liquid-glass-grid"></div>
  </div>

  <div id="app">
    <!-- Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-crest">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="brand-crown-svg">
            <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5z"></path>
          </svg>
        </div>
        <h1 class="brand-title">Grandmaster Chess</h1>
      </div>
      <div class="header-actions">
        <!-- Sound Mute/Unmute Toggle -->
        <button id="btn-sound" class="icon-btn" aria-label="Toggle Sound" title="Sound Mute/Unmute">
          <svg id="icon-sound-on" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Light / Dark Theme Toggle -->
        <button id="btn-theme" class="icon-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">
          <svg id="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-layout">
      <!-- Game Container (Player Bar + Chess Board + Player Bar) -->
      <section class="game-container" aria-label="Chessboard and players">
        <!-- Top Player Bar -->
        <div id="top-player-bar" class="player-bar top">
          <div class="player-info">
            <div id="top-player-avatar" class="player-avatar black">B</div>
            <span id="top-player-name" class="player-name">Black</span>
            <span id="top-material-badge" class="material-badge">+0</span>
          </div>
          <div class="player-status">
            <div id="top-captured-tray" class="captured-tray" aria-label="Captured pieces"></div>
            <span id="top-turn-pill" class="turn-pill">Turn</span>
          </div>
        </div>

        <!-- Board Grid Wrapper -->
        <div class="board-wrapper" id="board-wrapper">
          <div id="chess-board" class="chess-board" role="grid" aria-label="Interactive chess board">
            <!-- 64 squares rendered dynamically by ui.js -->
          </div>
        </div>

        <!-- Bottom Player Bar -->
        <div id="bottom-player-bar" class="player-bar bottom">
          <div class="player-info">
            <div id="bottom-player-avatar" class="player-avatar white">W</div>
            <span id="bottom-player-name" class="player-name">White</span>
            <span id="bottom-material-badge" class="material-badge">+0</span>
          </div>
          <div class="player-status">
            <div id="bottom-captured-tray" class="captured-tray" aria-label="Captured pieces"></div>
            <span id="bottom-turn-pill" class="turn-pill active">Turn</span>
          </div>
        </div>

        <!-- Primary Action Controls (Directly below chessboard for flawless mobile reachability) -->
        <div class="action-controls">
          <button id="btn-undo" class="btn" title="Undo Move">
            <svg viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 1 1 2.64 6.36L3 17"></path></svg>
            <span>Undo</span>
          </button>
          <button id="btn-redo" class="btn" title="Redo Move">
            <svg viewBox="0 0 24 24"><path d="M21 7v6h-6M21 13a9 9 0 1 0-2.64 6.36L21 17"></path></svg>
            <span>Redo</span>
          </button>
          <button id="btn-flip" class="btn" title="Flip Board">
            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            <span>Flip</span>
          </button>
          <button id="btn-new" class="btn btn-primary" title="Start New Game">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>New</span>
          </button>
        </div>
      </section>

      <!-- Side Control & History Panel -->
      <aside class="side-panel" aria-label="Game controls and move history">
        <!-- Game Status Card -->
        <div class="status-card">
          <div>
            <div id="status-title" class="status-text">White to Move</div>
            <div id="status-desc" class="status-subtext">Game in progress</div>
          </div>
          <div id="ai-thinking-badge" class="ai-thinking-badge" style="display: none;">
            <span class="ai-pulse"></span>
            <span>Thinking...</span>
          </div>
        </div>

        <!-- Game Mode & AI Difficulty Selector -->
        <div class="mode-card">
          <div class="mode-toggle-group">
            <button id="btn-mode-ai" class="mode-btn active" data-mode="ai">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mode-svg">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
              </svg>
              <span>vs Computer</span>
            </button>
            <button id="btn-mode-human" class="mode-btn" data-mode="human">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mode-svg">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>2-Player</span>
            </button>
          </div>
          <div id="ai-settings-panel" class="ai-settings-panel">
            <div class="setting-row">
              <span class="setting-label">AI Level:</span>
              <div class="setting-pills">
                <button class="pill-btn diff-btn" data-diff="easy">
                  <svg class="diff-gauge-svg easy" viewBox="0 0 12 12" width="12" height="12" fill="none">
                    <rect x="1" y="7" width="2.5" height="4" rx="0.8" fill="#10b981"/>
                    <rect x="4.75" y="4" width="2.5" height="7" rx="0.8" fill="rgba(255,255,255,0.2)"/>
                    <rect x="8.5" y="1" width="2.5" height="10" rx="0.8" fill="rgba(255,255,255,0.2)"/>
                  </svg>
                  <span>Easy</span>
                </button>
                <button class="pill-btn diff-btn active" data-diff="medium">
                  <svg class="diff-gauge-svg medium" viewBox="0 0 12 12" width="12" height="12" fill="none">
                    <rect x="1" y="7" width="2.5" height="4" rx="0.8" fill="#f59e0b"/>
                    <rect x="4.75" y="4" width="2.5" height="7" rx="0.8" fill="#f59e0b"/>
                    <rect x="8.5" y="1" width="2.5" height="10" rx="0.8" fill="rgba(255,255,255,0.2)"/>
                  </svg>
                  <span>Medium</span>
                </button>
                <button class="pill-btn diff-btn" data-diff="hard">
                  <svg class="diff-gauge-svg hard" viewBox="0 0 12 12" width="12" height="12" fill="none">
                    <rect x="1" y="7" width="2.5" height="4" rx="0.8" fill="#f43f5e"/>
                    <rect x="4.75" y="4" width="2.5" height="7" rx="0.8" fill="#f43f5e"/>
                    <rect x="8.5" y="1" width="2.5" height="10" rx="0.8" fill="#f43f5e"/>
                  </svg>
                  <span>Hard</span>
                </button>
              </div>
            </div>
            <div class="setting-row">
              <span class="setting-label">Play as:</span>
              <div class="setting-pills">
                <button class="pill-btn color-btn active" data-color="w">
                  <svg class="color-dot-svg white" viewBox="0 0 14 14" width="14" height="14">
                    <circle cx="7" cy="7" r="5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
                  </svg>
                  <span>White</span>
                </button>
                <button class="pill-btn color-btn" data-color="b">
                  <svg class="color-dot-svg black" viewBox="0 0 14 14" width="14" height="14">
                    <circle cx="7" cy="7" r="5" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
                  </svg>
                  <span>Black</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Move History Panel -->
        <div class="history-container">
          <div class="history-header">
            <span>Move History (SAN)</span>
            <span id="move-count-label">0 moves</span>
          </div>
          <div id="move-list" class="move-list" role="log" aria-live="polite">
            <!-- SAN moves rendered here -->
          </div>
        </div>

        <!-- Secondary Controls -->
        <div class="secondary-controls">
          <button id="btn-resign" class="btn btn-danger" title="Resign Current Game">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
              <line x1="4" y1="22" x2="4" y2="15"></line>
            </svg>
            <span>Resign</span>
          </button>
          <button id="btn-pgn" class="btn" title="Export PGN to Clipboard or File">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Export PGN</span>
          </button>
          <button id="btn-fen" class="btn" title="Copy Current Position FEN">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy FEN</span>
          </button>
        </div>
      </aside>
    </main>

    <!-- Touch-Friendly Pawn Promotion Modal -->
    <div id="promotion-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="prom-title">
      <div class="modal-card">
        <h2 id="prom-title" class="modal-title">Promote Pawn</h2>
        <p class="modal-description">Choose a piece for pawn promotion:</p>
        <div class="promotion-grid">
          <button class="promotion-piece-btn" data-piece="q" aria-label="Queen"></button>
          <button class="promotion-piece-btn" data-piece="r" aria-label="Rook"></button>
          <button class="promotion-piece-btn" data-piece="b" aria-label="Bishop"></button>
          <button class="promotion-piece-btn" data-piece="n" aria-label="Knight"></button>
        </div>
      </div>
    </div>

    <!-- Game Over Victory Modal -->
    <div id="game-over-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <div class="modal-card victory-card">
        <div class="victory-trophy-wrap">
          <div class="trophy-ray-glow"></div>
          <div id="game-over-trophy" class="trophy-icon">
            <svg viewBox="0 0 64 64" width="72" height="72" fill="none" class="trophy-svg-vector">
              <defs>
                <linearGradient id="trophy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fef08a"/>
                  <stop offset="35%" stop-color="#fbbf24"/>
                  <stop offset="70%" stop-color="#f59e0b"/>
                  <stop offset="100%" stop-color="#b45309"/>
                </linearGradient>
              </defs>
              <path d="M16 12h32v16c0 8.837-7.163 16-16 16s-16-7.163-16-16V12z" fill="url(#trophy-grad)"/>
              <path d="M16 16H9a4 4 0 0 0-4 4v3a9 9 0 0 0 9 9h2M48 16h7a4 4 0 0 1 4 4v3a9 9 0 0 1-9 9h-2" stroke="url(#trophy-grad)" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M28 44h8v8h-8zM20 52h24v4a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2v-4z" fill="url(#trophy-grad)"/>
              <path d="M32 18l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#ffffff" opacity="0.95"/>
            </svg>
          </div>
          <span id="game-over-badge" class="victory-banner-badge">VICTORY</span>
        </div>
        <h2 id="game-over-title" class="modal-title">Checkmate!</h2>
        <p id="game-over-desc" class="modal-description">White wins against Black.</p>

        <div class="victory-stats-row">
          <div class="victory-stat-pill">
            <span class="stat-pill-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="6" r="3"></circle>
                <path d="M8 21h8M10 13h4M9 17h6M10 9c0 4-2 6-2 8h8c0-2-2-4-2-8"></path>
              </svg>
            </span>
            <span id="game-over-moves-stat">0 Moves</span>
          </div>
          <div class="victory-stat-pill">
            <span class="stat-pill-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="6"></circle>
                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path>
              </svg>
            </span>
            <span id="game-over-reason-stat">Checkmate</span>
          </div>
        </div>

        <div class="modal-actions">
          <button id="btn-game-over-new" class="btn btn-primary btn-victory-primary">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Play Again</span>
          </button>
          <button id="btn-game-over-close" class="btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>View Board</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Banner -->
    <div class="toast-container">
      <div id="toast" class="toast">Action performed successfully</div>
    </div>
  </div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
